services:
  excloudvault:
    build:
      context: .
      dockerfile: Dockerfile
    image: excloudvault-web:latest
    container_name: excloudvault-web
    restart: unless-stopped
    ports:
      - "30010:3000"
    environment:
      PORT: 3000
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-admin@excloudvault.com}
      CONTACT_EMAIL_FROM: ${CONTACT_EMAIL_FROM:-no-reply@excloudvault.com}
    networks:
      - excloudvault-net
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.excloudvault.rule=Host(`excloudvault.mbabros.com`) || Host(`mbabros.com`) || Host(`www.mbabros.com`)"
      - "traefik.http.routers.excloudvault.entrypoints=https"
      - "traefik.http.routers.excloudvault.tls=true"
      - "traefik.http.services.excloudvault.loadbalancer.server.port=3000"

networks:
  excloudvault-net:
    name: excloudvault-net
