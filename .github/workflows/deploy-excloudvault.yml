name: Deploy ExCloudVault to Coolify (Mac Mini)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'stacks/excloudvault/**'

jobs:
  deploy-coolify:
    name: Deploy ExCloudVault to Coolify
    runs-on: [self-hosted, macmini]
    steps:
      - name: Checkout homelab repository
        uses: actions/checkout@v4

      - name: Stop legacy mbabros container if running
        run: |
          if docker ps -q --filter "name=mbabros-web" | grep -q .; then
            echo "Stopping legacy mbabros-web container to release port 30010..."
            docker stop mbabros-web 2>/dev/null || true
            docker rm mbabros-web 2>/dev/null || true
          fi

      - name: Build & Deploy excloudvault-web stack
        run: |
          echo "Building and launching Coolify-managed excloudvault stack on Mac Mini..."
          cd stacks/excloudvault
          docker build -t excloudvault-web:latest .
          COOLIFY_COMPOSE_DIR="/Users/aru/homelab/coolify/data/services/acxgaouv9ifw9puh1lohcazo"
          if [ -f "$COOLIFY_COMPOSE_DIR/docker-compose.yml" ]; then
            echo "Deploying via Coolify compose definition..."
            docker compose --project-directory "$COOLIFY_COMPOSE_DIR" -f "$COOLIFY_COMPOSE_DIR/docker-compose.yml" up -d --force-recreate
          else
            echo "Deploying via repo compose definition..."
            docker compose up -d --force-recreate
          fi

      - name: Verify Container Health
        run: |
          echo "Verifying local service health on port 30010..."
          for i in {1..15}; do
            STATUS=$(curl -s http://127.0.0.1:30010/healthz || true)
            if echo "$STATUS" | grep -q "ok"; then
              echo "✅ ExCloudVault service is healthy and responding!"
              break
            fi
            echo "Waiting for container startup... ($i/15)"
            sleep 2
          done
          docker ps --filter "name=excloudvault" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
